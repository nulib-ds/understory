AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Understory: admin backend for downstream IIIF sites"

Parameters:
  ServerlessIiifVersion:
    Type: String
    Default: "7.0.1"
  # --- Hosted admin UI ----------------------------------------------------------
  # All three matter only when GitHubBranch is set. Without a branch the stack
  # deploys no Amplify app at all, and the UI runs locally with npm run dev.
  GitHubRepo:
    Type: String
    Default: "https://github.com/nulib-ds/understory"
    Description: "URL of the GitHub repo Amplify builds the UI from: https://github.com/nulib-ds/understory, or your fork of it. Ignored without GitHubBranch."
  GitHubBranch:
    Type: String
    Default: ""
    Description: "Branch Amplify Hosting builds and serves the admin UI from, e.g. staging, main, or a feature branch on a dev stack. Leave blank to deploy no hosted UI."
  GitHubOAuthToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "GitHub personal access token with repo scope (https://github.com/settings/tokens). Required with GitHubBranch, ignored without it."
  SearchMaxOcu:
    Type: Number
    Default: 2
    AllowedValues: [2, 4, 8, 16]
    Description: "Ceiling on the search collection's capacity, in OCUs, applied to indexing and to search separately. This is the spend cap: the collection never scales past it. It scales to zero when idle whatever this says. Serverless accepts 2, 4, 8, 16 or multiples of 16."
  SearchIndexPrefix:
    Type: String
    Default: ""
    Description: "Prefix for this stack's OpenSearch index and alias names. Must be lowercase. Defaults to the stack name. Index names are built as <prefix>.<slug>._pub.<runId>, with <prefix>.<slug> as the alias a consuming site points at."
  # --- CDN and custom domains -------------------------------------------------
  # A dev stack sets none of these: both distributions are still created, and the
  # base URLs point at their generated *.cloudfront.net domains (see Outputs). Only
  # the aliases, the certificate and the DNS records are conditional — so a dev
  # stack exercises the same origins, cache behaviours and CORS headers as staging.
  ProjectName:
    Type: String
    Default: understory
    Description: "Used only to build hostnames (iiif-<project>.<base>, images-<project>.<base>, admin-<project>.<base>). Must be lowercase. It ends up inside published document URLs, so do not change it on a stack that has published."
  BaseDomainName:
    Type: String
    Default: ""
    Description: "e.g. library.northwestern.edu, or rdc-staging.library.northwestern.edu. Leave blank for a dev stack."
  CertificateArn:
    Type: String
    Default: ""
    Description: "ACM certificate ARN in us-east-1 covering *.<BaseDomainName>. One certificate serves both distributions and the Amplify domain. Required whenever BaseDomainName is set; ignored otherwise."
  HostedZoneId:
    Type: String
    Default: ""
    Description: "Route53 hosted zone for BaseDomainName. Optional: leave blank to set the domains up but manage the DNS records elsewhere. Covers the two CloudFront aliases only — the admin hostname's record belongs to Amplify, which writes it itself when the zone is in this account and otherwise hands it to you in the console."
  ImageApiForceHost:
    Type: String
    Default: ""
    Description: "Bare hostname info.json should advertise, overriding the derived one. Only needed on a stack with NO custom domain: deploy once, copy the ImagesDistributionHost output (a bare host - no https://, no /iiif/3), set this, deploy again. Without it a dev stack serves tiles straight from the Lambda and the CDN never sees them."

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 300
    MemorySize: 1025
    Environment:
      Variables:
        SOURCE_BUCKET: !Sub "${AWS::StackName}-source"
        IIIF_BUCKET: !Sub "${AWS::StackName}-iiif"
        # Both spaces live under one base URL as path segments, so there is one
        # hostname and one distribution for working/ and published/ alike. See
        # IIIFDistribution: published/ is cached, working/ is routed through
        # uncached, and after OAC there is no direct S3 route to either.
        IIIF_BASE_URL: !If
          - HasCustomDomain
          - !Sub "https://iiif-${ProjectName}.${BaseDomainName}"
          - !Sub "https://${IIIFDistribution.DomainName}"
        IMAGE_API_BASE_URL: !If
          - HasCustomDomain
          - !Sub "https://images-${ProjectName}.${BaseDomainName}/iiif/3"
          - !Sub "https://${ImagesDistribution.DomainName}/iiif/3"

Conditions:
  SearchIndexPrefixProvided: !Not [!Equals [!Ref SearchIndexPrefix, ""]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref BaseDomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  HasImageApiForceHost: !Not [!Equals [!Ref ImageApiForceHost, ""]]
  # Domains can be configured without handing this stack the zone.
  ManageDns: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  # No branch, no Amplify app: a dev stack runs the UI locally instead.
  HasHostedUI: !Not [!Equals [!Ref GitHubBranch, ""]]
  HasHostedUIDomain: !And
    - !Condition HasHostedUI
    - !Condition HasCustomDomain

# Checked before any resource is touched. Without it a missing token fails at
# AmplifyApp, part-way through a create, and the rollback leaves the two
# retained buckets behind to block the next attempt by name.
Rules:
  HostedUINeedsToken:
    RuleCondition: !Not [!Equals [!Ref GitHubBranch, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref GitHubOAuthToken, ""]]
        AssertDescription: "GitHubBranch deploys the hosted UI, which needs GitHubOAuthToken."

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - IIIFImageFunctionS3Permission
      - AVTranscodeFunctionS3Permission
    Properties:
      BucketName: !Sub "${AWS::StackName}-source"
      # A browser upload of a large file is a multipart upload, and closing the
      # tab midway leaves its parts behind: invisible in a listing, billed as
      # storage, and never cleaned up by anything else. Nothing legitimate
      # takes three days to finish.
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: image/
            Function: !GetAtt IIIFImageFunction.Arn
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: av/
            Function: !GetAtt AVTranscodeFunction.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag

  IIIFBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-iiif"
      # The same rule as the source bucket, for the multipart writes that land
      # here: lib-storage uploads during import, and MediaConvert's own.
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
      # Nothing reaches this bucket directly any more: every IIIF document is
      # served through IIIFDistribution, which reads via OAC. The website
      # endpoint went with it — it was already unused, because IIIF_BASE_URL has
      # always pointed at the REST endpoint rather than the website one.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Vestigial once CloudFront fronts the bucket: browsers no longer reach S3
      # here, and the CORS headers a viewer sees come from IiifCorsPolicy on the
      # distribution. Kept because it costs nothing and removing it would only
      # matter if something were still reading S3 directly — in which case we
      # would want to find that out from a CORS error rather than a 403.
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
            AllowedOrigins:
              - "*"

  IIIFBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IIIFBucket
      PolicyDocument:
        Statement:
          # Narrowed from /* to the two IIIF spaces. Clover fetches working
          # manifests anonymously, so drafts stay readable — "published" means
          # "in the consuming site's feed", not "visible". What this excludes is
          # internal/*: import status and publish plans are operational, not
          # part of either space. Pyramid TIFFs under image/* are read by
          # serverless-iiif through its own role, never fetched directly.
          #
          # av/* is transcoded audio/video — HLS playlists, segments, posters
          # and each asset's media.json — and IS fetched directly, by the
          # player. It sits outside both spaces on purpose: publishing rewrites
          # only {base}/working/…, so a published canvas points at the same
          # stream as its draft and media is never copied, just as a TIFF is
          # never copied. It rides the default (cached) behaviour; segments
          # are immutable, and media.json is written no-cache.
          #
          # The principal is now CloudFront rather than "*": anonymous reads
          # still work, but only through the distribution, so the cache and the
          # CORS response headers cannot be bypassed. SourceArn is what stops
          # any other account's distribution naming this bucket as an origin.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub "arn:aws:s3:::${AWS::StackName}-iiif/working/*"
              - !Sub "arn:aws:s3:::${AWS::StackName}-iiif/published/*"
              - !Sub "arn:aws:s3:::${AWS::StackName}-iiif/av/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}"

  # --- CDN --------------------------------------------------------------------

  IIIFOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-iiif-oac"
        Description: "Signed reads from the IIIF bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  IiifCorsPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-iiif-cors"
        Comment: "IIIF is cross-origin by construction — a viewer on any host fetches these."
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ["*"]
          AccessControlAllowMethods:
            Items: [GET, HEAD, OPTIONS]
          AccessControlAllowOrigins:
            Items: ["*"]
          AccessControlMaxAgeSec: 3600
          OriginOverride: true

  # The CORS policy above plus "never reuse without asking", for working/* only.
  #
  # The edge already passes every working request through (CachingDisabled), but
  # that is the CDN's cache. S3 sends these objects with no Cache-Control, so a
  # BROWSER caches them heuristically from Last-Modified and keeps handing a page
  # the document as it was a minute ago: a slider drawn from the collection
  # document stayed in its old order after a save, and a viewer can do the same
  # with a manifest. no-cache means "revalidate every time", a conditional
  # request the edge answers 304 from S3, not a fresh download.
  #
  # Its own policy because published/* shares IiifCorsPolicy and must stay
  # cacheable. Response headers policies are capped per account like cache
  # policies are; this makes two per stack.
  IiifWorkingHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-iiif-working"
        Comment: "IIIF CORS plus Cache-Control: no-cache, for the drafts a save must show at once."
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ["*"]
          AccessControlAllowMethods:
            Items: [GET, HEAD, OPTIONS]
          AccessControlAllowOrigins:
            Items: ["*"]
          AccessControlMaxAgeSec: 3600
          OriginOverride: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: no-cache
              Override: true

  # Cache policies are the AWS MANAGED ones, referenced by id below rather than
  # declared here. Custom cache policies are capped at 20 per ACCOUNT — shared
  # with every other project in it — and three per stack would put a ceiling of
  # about five personal stacks on that. Managed policies are AWS-owned and count
  # against nothing.
  #
  # All three declared policies turned out to have exact managed equivalents, so
  # this costs no behaviour. What each one is, and why it is the right one, is
  # recorded at the cache behaviour that uses it.
  #
  # The one exception is PublicSearchCachePolicy, below: one per stack, because
  # no managed policy fits. Search results vary by query string, and every
  # managed policy that keys on query strings also keys on Host, which
  # CloudFront then forwards — and a Lambda Function URL refuses a request
  # whose Host is not its own.

  # Signs every request IIIFDistribution sends to PublicSearchFunction's
  # Function URL, which accepts nothing unsigned (AuthType AWS_IAM). That is
  # what makes the distribution the only way in, as OAC does for the bucket.
  PublicSearchOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-search-oac"
        Description: "Signed requests to the public search function"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # The key is the path plus exactly the three parameters the route reads.
  # Listing them, rather than keying on every query string, means a junk
  # parameter cannot split the cache or reach the function: CloudFront forwards
  # only what is in the key. A new parameter needs a line here.
  #
  # TTLs come from the function's Cache-Control (s-maxage=3600 on results). The
  # flip invalidates /search/{slug}*, so the hour only bounds staleness if that
  # invalidation fails.
  PublicSearchCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-search"
        Comment: "Public search: path plus q, from and size"
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [q, from, size]

  IIIFDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} IIIF documents"
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If
          - HasCustomDomain
          - [!Sub "iiif-${ProjectName}.${BaseDomainName}"]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: iiif-bucket
            DomainName: !GetAtt IIIFBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt IIIFOriginAccessControl.Id
            # Required alongside OriginAccessControlId, and must be empty: this
            # is how an S3 origin says "OAC, not the legacy OAI".
            S3OriginConfig:
              OriginAccessIdentity: ""
          # The Function URL's bare host: FunctionUrl is "https://{host}/".
          - Id: public-search
            DomainName: !Select [2, !Split ["/", !GetAtt PublicSearchFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt PublicSearchOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: iiif-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # CachingOptimized: no cookies, headers or query strings in the key,
          # Accept-Encoding normalized in. Long-lived; the publish run
          # invalidates it. MinTTL is 1s rather than 0, which only means an
          # origin "no-cache" is honoured a second late — irrelevant here.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref IiifCorsPolicy
        CacheBehaviors:
          - PathPattern: "working/*"
            TargetOriginId: iiif-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            # CachingDisabled: every TTL 0, so this is a pass-through to S3 and
            # every request sees current bytes. That is the point — a save is
            # followed almost immediately by a read that has to see it, and any
            # TTL here reads as "the save did nothing".
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref IiifWorkingHeadersPolicy
          # The public search route, on the same host as the documents a site
          # already reads. Not a space: nothing under search/ is in the bucket.
          # Cached, so repeat queries and crawlers are answered here without
          # waking the search collection.
          - PathPattern: "search/*"
            TargetOriginId: public-search
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref PublicSearchCachePolicy
            ResponseHeadersPolicyId: !Ref IiifCorsPolicy

  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} IIIF Image API"
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If
          - HasCustomDomain
          - [!Sub "images-${ProjectName}.${BaseDomainName}"]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: iiif-lambda
            DomainName: !GetAtt IiifServer.Outputs.FunctionDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: iiif-lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: false
          # CachingOptimizedForUncompressedObjects: same minimal key as
          # CachingOptimized, but WITHOUT Accept-Encoding. That distinction is
          # the whole reason this differs from the document distribution — the
          # IIIF Image API encodes the entire request in the path
          # (/{id}/{region}/{size}/{rotation}/{quality}.{format}), so the path
          # alone is a complete cache key, and tiles are already-compressed JPEG
          # or PNG. Varying on Accept-Encoding would multiply every tile entry
          # for nothing.
          CachePolicyId: b2884449-e4de-46a7-ac36-70bc7f1ddd6d
          ResponseHeadersPolicyId: !Ref IiifCorsPolicy

  # Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone id — the same value in every
  # region and account, not something this stack can look up.
  IIIFDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "iiif-${ProjectName}.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt IIIFDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ImagesDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "images-${ProjectName}.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ImagesDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # Roles are Cognito Groups so they ride in the ID token as `cognito:groups`
  # and the API can authorize with no extra lookup. Precedence is Cognito's own
  # tie-breaker; the app resolves admin over editor itself, but keeping these
  # consistent avoids surprises for anything else reading the pool.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: admin
      Description: "Full access, including managing users and collection grants"
      Precedence: 0

  EditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: editor
      Description: "Full control of works inside granted collections"
      Precedence: 10

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${AWS::StackName}-identity"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: IIIFBucketRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
        - PolicyName: SourceBucketImageAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${AWS::StackName}-source/image/*"
                  - !Sub "arn:aws:s3:::${AWS::StackName}-source/av/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "image/*"
                      - "av/*"

  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  # --- Search -----------------------------------------------------------------
  # One OpenSearch Serverless NextGen collection per stack, holding only the
  # published side: each publish run's candidate index and the per-collection
  # aliases a consuming site points at. The admin works list does not use it
  # (it reads the collection documents), so curators browsing never wake it.
  #
  # NextGen, not Classic, because it scales to zero: with no request for ten
  # minutes, indexing and search capacity each drop to 0 OCUs, and the next
  # request waits ~10s while it comes back, queued rather than refused. Classic
  # bills a floor of OCUs around the clock. Storage is billed either way.
  #
  # Every name here is the stack name, alone or with a suffix: collection names
  # are 3-28 characters, group and policy names at most 32, all lowercase
  # letters, digits and hyphens starting with a letter. A stack name longer
  # than 27 characters will not deploy.
  SearchCollectionGroup:
    Type: AWS::OpenSearchServerless::CollectionGroup
    Properties:
      Name: !Ref AWS::StackName
      Description: !Sub "Published search indexes for ${AWS::StackName}"
      Generation: NEXTGEN
      # ENABLED is the only value a NEXTGEN group accepts — DISABLED is refused
      # at create — and the property is required. Unlike Classic, where it
      # doubled the OCU floor, NextGen has no floor to double: it still scales
      # to zero.
      StandbyReplicas: ENABLED
      CapacityLimits:
        MinIndexingCapacityInOcu: 0
        MinSearchCapacityInOcu: 0
        MaxIndexingCapacityInOcu: !Ref SearchMaxOcu
        MaxSearchCapacityInOcu: !Ref SearchMaxOcu

  # A collection cannot be created until an encryption policy covers it.
  # An AWS-owned key: nothing in the index is not already public in published/.
  SearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-enc"
      Type: encryption
      Policy: !Sub '{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}"]}],"AWSOwnedKey":true}'

  # Reachable from the internet, but every request is SigV4-signed and checked
  # against SearchDataAccessPolicy, so "public" here means routable, not open.
  # The Lambdas run outside any VPC, which is why this is not a VPC endpoint.
  SearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-net"
      Type: network
      Policy: !Sub '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}"]}],"AllowFromPublic":true}]'

  # Serverless checks this AND the role's IAM policy (aoss:APIAccessAll on
  # ManifestFunction). Two principals, both this stack's own roles and no
  # person's:
  #
  #   - ManifestFunctionRole, shared by every function that builds or flips an
  #     index. Collection-level permissions cover the aliases; index-level ones
  #     cover the candidate indexes.
  #   - PublicSearchFunctionRole, the unauthenticated route's, READ-ONLY: it can
  #     search and describe, never create, write, delete or move an alias. That
  #     is what bounds the worst a bug in the public route can do to reading
  #     data that is already public in published/.
  SearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-data"
      Type: data
      Policy: !Sub
        - '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/${AWS::StackName}/*"],"Permission":["aoss:CreateIndex","aoss:DeleteIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}],"Principal":["${RoleArn}"]},{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}"],"Permission":["aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/${AWS::StackName}/*"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]}],"Principal":["${PublicSearchRoleArn}"]}]'
        - RoleArn: !GetAtt ManifestFunctionRole.Arn
          PublicSearchRoleArn: !GetAtt PublicSearchFunctionRole.Arn

  SearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    # The group is named rather than referenced (CollectionGroupName takes a
    # name, and the group's Ref is its id), so the ordering is explicit.
    DependsOn: [SearchEncryptionPolicy, SearchNetworkPolicy, SearchCollectionGroup]
    Properties:
      Name: !Ref AWS::StackName
      Type: SEARCH
      CollectionGroupName: !Ref AWS::StackName
      Description: !Sub "Published search indexes for ${AWS::StackName}"

  ManifestHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
            IdentitySource: $request.header.Authorization
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "Content-Type"
          - "Authorization"

  ManifestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/manifest/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-manifest-api"
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          OPENSEARCH_ENDPOINT: !GetAtt SearchCollection.CollectionEndpoint
          SEARCH_INDEX_PREFIX: !If [SearchIndexPrefixProvided, !Ref SearchIndexPrefix, !Ref "AWS::StackName"]
          # Built by hand rather than !Ref: the state machine's role is this
          # function's role, so referencing the machine here would be circular.
          PUBLISH_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-publish"
          # Same story: ImportStateMachine also runs as this function's role.
          IMPORT_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-import"
          # The flip invalidates the public search route's cached results.
          CLOUDFRONT_DISTRIBUTION_ID: !Ref IIIFDistribution
      # The import walk hands off to itself when a very large work outruns one
      # invocation's time budget. Lambda's recursive-loop detection treats that
      # as a runaway and TERMINATES the chain after ~16 hops — silently, with
      # nothing in the logs — which stranded large imports at "in-progress".
      # The walk is bounded (MAX_CANVAS_INDEX) and advances monotonically, so
      # opting out is safe and is exactly what this setting is for.
      RecursiveLoop: Allow
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: EventBridge
            Destination: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manifest-api"
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
            # The publish routes flip a collection's search alias and drop the
            # index it leaves; PublishFunction shares this role to build them.
            # Serverless wants BOTH actions, or every request is a 403, plus a
            # data access policy naming this role (SearchDataAccessPolicy).
            # Neither alone is enough.
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
                - aoss:DashboardsAccessAll
              Resource: !GetAtt SearchCollection.Arn
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-publish"
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-import"
            # The publish run drops the edge cache for published/ once it has
            # written it, and the flip drops the collection's cached search
            # results. CloudFront ARNs carry no region segment.
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
                - cloudfront:GetInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}"
            # A "running" status object is only a claim. States.ALL does not
            # catch States.Runtime, so an execution can die without the
            # RecordFailure state ever writing a terminal status — and then the
            # collection is pinned at "running" for ever. Reading the execution
            # is what lets that be reconciled.
            - Effect: Allow
              Action:
                - states:DescribeExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-publish:*"
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-import:*"
            # The Users section. Scoped to this stack's own pool, and to the
            # group/user calls it actually makes — notably NOT AdminCreateUser
            # or AdminDeleteUser: accounts stay a console/CLI operation.
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListGroups
                - cognito-idp:ListUsersInGroup
                - cognito-idp:CreateGroup
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        CreateManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests
            Method: POST
        ImportManifestPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/import/preview
            Method: POST
        ImportManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/import
            Method: POST
        GetManifestById:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: GET
        DeleteManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: DELETE
        GetImportStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/import-status
            Method: GET
        ImportResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/import-resume
            Method: POST
        ImportFailureEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["lambda"]
              detail-type: ["Lambda Function Invocation Result - Failure"]
              detail:
                requestContext:
                  functionArn:
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manifest-api"
        UpdateManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: PUT
        UpdateManifestItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/items
            Method: PUT
        ListUnattachedMedia:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/media
            Method: GET
        DiscardMedia:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/media/{assetId}
            Method: DELETE
        UpdateManifestCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/collection
            Method: PUT
        GetCollectionPublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/publish
            Method: GET
        StartCollectionPublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/publish
            Method: POST
        PublishCollectionIndex:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/publish/index
            Method: POST
        ListCollectionWorks:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/works
            Method: GET
        SearchCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/search
            Method: GET
        ListCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections
            Method: GET
        ReindexCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/reindex
            Method: POST
        CreateCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections
            Method: POST
        # Importing a whole collection. "import" is a reserved collection id
        # (sanitizeCollectionSlug), so these two literal paths cannot be shadowed
        # by a collection that happens to be called that.
        ImportCollectionPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/import/preview
            Method: POST
        ImportCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/import
            Method: POST
        GetCollectionImport:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/import
            Method: GET
        OrderCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/order
            Method: PUT
        GetCollectionImportPlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/import/plan
            Method: GET
        DeleteCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}
            Method: DELETE
        ListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /users
            Method: GET
        UpdateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /users/{username}
            Method: PUT

  # The publish pipeline. An INLINE Map, not a Distributed Map: Plan writes the
  # work list to S3 and emits only ~N/25 batch indices as this state's output,
  # which is a few KB against the 256KB state limit. That avoids ItemReader IAM,
  # the ResultWriter payload trap, and the circular dependency a Distributed Map
  # creates by needing states:StartExecution on itself. Inline Map's ceiling of
  # 40 concurrent is well above the 8 we want.
  PublishFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/publish/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-publish"
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt SearchCollection.CollectionEndpoint
          SEARCH_INDEX_PREFIX: !If [SearchIndexPrefixProvided, !Ref SearchIndexPrefix, !Ref "AWS::StackName"]
          CLOUDFRONT_DISTRIBUTION_ID: !Ref IIIFDistribution
      # Deliberately the same role as ManifestFunction: both sign requests to
      # the search collection, and SearchDataAccessPolicy then names one
      # principal rather than one per function.
      Role: !GetAtt ManifestFunctionRole.Arn

  # GET /search/{slug} — the search a consuming site calls, and the only
  # unauthenticated route into the stack. Kept apart from ManifestFunction on
  # purpose: that role can write S3, delete indexes and manage users, and a
  # public route on it would expose its whole router. This one has its own role,
  # read-only in SearchDataAccessPolicy, and no S3 access at all.
  #
  # Callable only through IIIFDistribution (search/*): AuthType AWS_IAM, and the
  # only principal allowed to invoke it is CloudFront on behalf of that
  # distribution, which signs through PublicSearchOriginAccessControl. So the
  # edge cache cannot be bypassed.
  PublicSearchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/public-search/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-public-search"
      CodeUri: ../
      Handler: index.handler
      # A cold search collection takes ~10s to answer; CloudFront gives an
      # origin 30s.
      Timeout: 25
      MemorySize: 256
      # The ceiling on concurrent public searches, so a flood of cache misses
      # cannot crowd out the rest of the account or run up the bill. Past it a
      # request gets a 429 rather than a queue. SearchMaxOcu is the other cap.
      ReservedConcurrentExecutions: 10
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt SearchCollection.CollectionEndpoint
          SEARCH_INDEX_PREFIX: !If [SearchIndexPrefixProvided, !Ref SearchIndexPrefix, !Ref "AWS::StackName"]
          # Overrides the Global, and must: the Global names IIIFDistribution,
          # which names this function's URL as an origin, so inheriting it is a
          # CloudFormation cycle. Nothing here builds a document URL.
          IIIF_BASE_URL: ""
      Policies:
        - Statement:
            # Both, as for ManifestFunction, or every request is a 403. What it
            # may do once in is SearchDataAccessPolicy's read-only grant.
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
                - aoss:DashboardsAccessAll
              Resource: !GetAtt SearchCollection.Arn

  # A Function URL behind OAC needs both: InvokeFunctionUrl for the URL, and
  # InvokeFunction for the invocation behind it, the latter limited to
  # invocations that arrive through the URL. SourceArn is what stops any other
  # account's distribution naming this function as an origin.
  PublicSearchUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref PublicSearchFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}"

  PublicSearchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PublicSearchFunction
      InvokedViaFunctionUrl: true
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}"

  PublishStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-publish"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PublishFunction
      Definition:
        Comment: "Publish one collection's IIIF assets and stage its search index"
        StartAt: Plan
        States:
          Plan:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: plan
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "requestedBy.$": "$.requestedBy"
            ResultPath: "$.plan"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: PublishWorks
          PublishWorks:
            Type: Map
            ItemsPath: "$.plan.batches"
            MaxConcurrency: 8
            Parameters:
              task: batch
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "indexName.$": "$.plan.indexName"
              # $$ is the Step Functions CONTEXT object, not the state input:
              # $$.Map.Item.Value is the current item. A single $ makes this
              # $.Map.Item.Value, which looks plausible and fails at runtime with
              # "could not be found in the input". Do not "fix" the doubled $.
              "batchIndex.$": "$$.Map.Item.Value"
            Iterator:
              StartAt: PublishBatch
              States:
                PublishBatch:
                  Type: Task
                  Resource: !GetAtt PublishFunction.Arn
                  Retry:
                    - ErrorEquals:
                        - Lambda.TooManyRequestsException
                        - Lambda.ServiceException
                        - States.TaskFailed
                      IntervalSeconds: 2
                      MaxAttempts: 3
                      BackoffRate: 2
                  End: true
            # The Map's aggregated output is capped at 256KB; each batch writes
            # its own result object to S3, so nothing needs to come back here.
            ResultPath: null
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: WriteCollection
          WriteCollection:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: writeCollection
              "slug.$": "$.slug"
              "runId.$": "$.runId"
            ResultPath: "$.result"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: Invalidate
          # Drop the edge cache for published/ now that every byte of it is
          # written. Deliberately NOT a step that can fail the run: by this point
          # the published documents are correct and durable, and a stale edge
          # cache is hygiene rather than correctness. Catching to Finalize rather
          # than RecordFailure is what stops a CloudFront hiccup reporting a
          # collection as failed when it published perfectly.
          #
          # ResultPath is null so $.result — which Finalize reads — survives.
          Invalidate:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: invalidate
              "slug.$": "$.slug"
              "runId.$": "$.runId"
            ResultPath: null
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.invalidateError"
                Next: Finalize
            Next: Finalize
          Finalize:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: finalize
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "indexName.$": "$.plan.indexName"
              "result.$": "$.result"
            # Safe to retry: stageActions never unstages its own candidate
            # (publish.test.js), and every write here replaces a whole object.
            # Worth it because Finalize moves an alias and then records it, and
            # failing between the two would leave the panel's copy behind.
            Retry:
              - ErrorEquals: ["States.ALL"]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            End: true
          RecordFailure:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: recordFailure
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "error.$": "$.error"
            Next: Failed
          Failed:
            Type: Fail
            Error: PublishFailed
            Cause: "The publish run did not complete; see the collection's status object"


  # Importing a whole IIIF Collection and every work in it.
  #
  # A state machine rather than the self-invoke chain in importAssets.js because
  # collections run to thousands of works — which is exactly the case AGENTS.md
  # says to copy PublishStateMachine for. Same shape as the publish pipeline: an
  # INLINE Map whose Plan writes the work list to S3 and emits only batch
  # indices, so the state payload stays a few KB against the 256KB limit.
  ImportFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/import/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import"
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      # No search settings: since the working index went, an import writes
      # nothing to OpenSearch. The role is still ManifestFunction's, because
      # this worker writes manifests and collection documents through the same
      # store.js and collectionStore.js, and needs the same S3 and Lambda grants.
      Role: !GetAtt ManifestFunctionRole.Arn

  ImportStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-import"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ImportFunction
      Definition:
        Comment: "Import one IIIF Collection and every work in it"
        StartAt: Plan
        States:
          # Mints every work id up front and writes them to plan.json. That is
          # what makes a retry idempotent: a batch always owns the same ids, so
          # re-running it overwrites the same manifests instead of minting a
          # second copy of every work.
          Plan:
            Type: Task
            Resource: !GetAtt ImportFunction.Arn
            Parameters:
              task: plan
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "sourceUrl.$": "$.sourceUrl"
            ResultPath: "$.plan"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: ImportWorks
          ImportWorks:
            Type: Map
            ItemsPath: "$.plan.batches"
            # The throttle, in batches. Each batch imports its works ONE AT A
            # TIME, so this is 5 works in flight, each copying up to
            # CANVAS_CONCURRENCY canvases — roughly 50 concurrent requests at the
            # source whatever the size of the collection. Our own API could take
            # far more; somebody else's may not.
            MaxConcurrency: 5
            Parameters:
              task: batch
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              # $$ is the Step Functions CONTEXT object, not the state input:
              # $$.Map.Item.Value is the current item. A single $ makes this
              # $.Map.Item.Value, which looks plausible and fails at runtime with
              # "could not be found in the input". Do not "fix" the doubled $.
              "batchIndex.$": "$$.Map.Item.Value"
            Iterator:
              StartAt: ImportBatch
              States:
                ImportBatch:
                  Type: Task
                  Resource: !GetAtt ImportFunction.Arn
                  # States.TaskFailed is what a source throttling us surfaces as,
                  # so backing off here is what keeps a big run from hammering
                  # somebody else's API when it starts pushing back.
                  Retry:
                    - ErrorEquals:
                        - Lambda.TooManyRequestsException
                        - Lambda.ServiceException
                        - States.TaskFailed
                      IntervalSeconds: 5
                      MaxAttempts: 3
                      BackoffRate: 2
                  End: true
            # The Map's aggregated output is capped at 256KB; each batch writes
            # its own result object to S3, so nothing needs to come back here.
            ResultPath: null
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: WriteCollection
          # Built from what the batches ACTUALLY did, never from the plan, so the
          # collection can never advertise a manifest that 404s. This is also the
          # only writer of the collection document during a run, which is what
          # keeps the whole pipeline free of concurrent-write problems.
          WriteCollection:
            Type: Task
            Resource: !GetAtt ImportFunction.Arn
            Parameters:
              task: writeCollection
              "slug.$": "$.slug"
              "runId.$": "$.runId"
            ResultPath: "$.result"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: Finalize
          Finalize:
            Type: Task
            Resource: !GetAtt ImportFunction.Arn
            Parameters:
              task: finalize
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "result.$": "$.result"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            End: true
          # Clears the `importing` flag on every work that landed before writing
          # the terminal status. That flag is what stops a publish freezing a
          # half-rewritten manifest, so leaving it set on a dead run would make
          # the collection unpublishable for ever.
          RecordFailure:
            Type: Task
            Resource: !GetAtt ImportFunction.Arn
            Parameters:
              task: recordFailure
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "error.$": "$.error"
            Next: Failed
          Failed:
            Type: Fail
            Error: ImportFailed
            Cause: "The import run did not complete; see the collection's status object"
  IIIFImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-iiif-image"
      CodeUri: lambdas/iiif-image/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/*"
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-iiif"

  IIIFImageFunctionS3Permission:
    Type: AWS::Lambda::Permission
    DependsOn: IIIFImageFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IIIFImageFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-source"

  # Audio/video. The same shape as IIIFImageFunction — an S3 upload under av/
  # in the source bucket starts the work — except the work is a MediaConvert
  # job rather than something done in-process: a Lambda's 15-minute limit and
  # 10GB of /tmp are not enough for a long video. The job's completion comes
  # back through EventBridge to the same function, which writes media.json.
  AVTranscodeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/av-transcode/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-av-transcode"
      CodeUri: ../
      Handler: index.handler
      # Submitting a job and writing a small JSON object; the transcode itself
      # runs in MediaConvert.
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          MEDIACONVERT_ROLE_ARN: !GetAtt MediaConvertRole.Arn
          STACK_NAME: !Ref "AWS::StackName"
      Policies:
        - Statement:
            - Effect: Allow
              Action: mediaconvert:CreateJob
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MediaConvertRole.Arn
              Condition:
                StringEquals:
                  "iam:PassedToService": mediaconvert.amazonaws.com
            # Read/replace/remove media.json and renditions. Delete and List are
            # for one case: an asset discarded while its job was still running,
            # whose late-arriving outputs are removed when the job completes.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/av/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
              Condition:
                StringLike:
                  s3:prefix:
                    - "av/*"
            # HeadObject on the upload: its original filename, and whether it
            # still exists when the job completes.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/av/*"
      Events:
        # The account's default bus carries every personal stack's jobs, so the
        # rule matches only jobs this stack tagged as its own.
        JobStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.mediaconvert
              detail-type:
                - MediaConvert Job State Change
              detail:
                status:
                  - COMPLETE
                  - ERROR
                userMetadata:
                  stack:
                    - !Ref "AWS::StackName"

  AVTranscodeFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AVTranscodeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-source"

  # What MediaConvert itself runs as: read the upload, write the renditions.
  # Scoped to av/ on both sides so a job can never touch images or documents.
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AVTranscodeIO
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/av/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/av/*"

  # Assumed by Amplify Hosting compute to write the Next.js server's logs to
  # CloudWatch, and for nothing else: the server calls no AWS service. Pages
  # render in the browser and call the API with the user's own token.
  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Condition: HasHostedUI
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AmplifyComputeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/amplify/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/amplify/*:log-stream:*"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

  AmplifyApp:
    Type: AWS::Amplify::App
    Condition: HasHostedUI
    Properties:
      Name: !Sub "${AWS::StackName}-ui"
      Repository: !Ref GitHubRepo
      OauthToken: !Ref GitHubOAuthToken
      # Next.js on Amplify Hosting's managed server, not a static site:
      # collection slugs and work ids are created at runtime, so their routes
      # cannot be prerendered. AWS supports Next.js 12-15 here; move to 16 once
      # it is listed. The server does the routing, so there is no rewrite rule.
      Platform: WEB_COMPUTE
      IAMServiceRole: !GetAtt AmplifyServiceRole.Arn
      # Must stay empty: the old static site's rewrite of every path to
      # /index.html sends the server's routes to a page it does not have.
      # CloudFormation does not clear rules an existing app already has, even
      # set to [] here, so converting an older stack also needs, once:
      #   aws amplify update-app --app-id <id> --custom-rules '[]'
      CustomRules: []
      # The build is amplify.yml at the repo root, versioned with the code it
      # builds. Amplify gives that file precedence over a spec set here, so
      # there is none.
      EnvironmentVariables:
        # The app's folder in this repo, matching appRoot in amplify.yml. AWS
        # requires it to be set explicitly on an app created by CloudFormation.
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: ui
        # Next.js inlines NEXT_PUBLIC_* into the browser bundle at build time.
        # The Image API base, despite the name. Must be the distribution, not
        # the Function URL behind it, or the admin UI fetches every tile past
        # the cache.
        - Name: NEXT_PUBLIC_IIIF_BASE_URL
          Value: !If
            - HasCustomDomain
            - !Sub "https://images-${ProjectName}.${BaseDomainName}/iiif/3"
            - !Sub "https://${ImagesDistribution.DomainName}/iiif/3"
        - Name: NEXT_PUBLIC_MANIFEST_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/manifests"
        - Name: NEXT_PUBLIC_COLLECTION_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/collections"
        - Name: NEXT_PUBLIC_STORAGE_BUCKET
          Value: !Sub "${AWS::StackName}-iiif"
        - Name: NEXT_PUBLIC_SOURCE_BUCKET
          Value: !Sub "${AWS::StackName}-source"
        - Name: NEXT_PUBLIC_STORAGE_REGION
          Value: !Ref AWS::Region
        - Name: NEXT_PUBLIC_STORAGE_IDENTITY_POOL_ID
          Value: !Ref CognitoIdentityPool
        - Name: NEXT_PUBLIC_COGNITO_USER_POOL_ID
          Value: !Ref CognitoUserPool
        - Name: NEXT_PUBLIC_COGNITO_CLIENT_ID
          Value: !Ref CognitoUserPoolClient

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Condition: HasHostedUI
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref GitHubBranch
      Framework: "Next.js - SSR"
      EnableAutoBuild: true

  # The admin UI's hostname, alongside iiif-<project> and images-<project>.
  # Unlike those two there is no Route53 RecordSet here. Amplify owns the CNAME
  # for a domain attached to it and writes that record itself whenever the
  # hosted zone is in this account, and nothing in CloudFormation exposes the
  # target it points at — so a record written here would be a guess that
  # Amplify then fights over. With the zone managed elsewhere, copy the record
  # Amplify shows under Hosting > Custom domains and add it there by hand.
  # HostedZoneId is not consulted either way, so ManageDns does not gate this.
  AmplifyDomain:
    Type: AWS::Amplify::Domain
    Condition: HasHostedUIDomain
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      DomainName: !Sub "admin-${ProjectName}.${BaseDomainName}"
      # CUSTOM reuses the same wildcard certificate as the two distributions
      # instead of having Amplify provision one of its own. An AMPLIFY_MANAGED
      # certificate would sit in PENDING_VERIFICATION waiting for a validation
      # record, which is a DNS round trip this stack has already paid for once.
      CertificateSettings:
        CertificateType: CUSTOM
        CustomCertificateArn: !Ref CertificateArn
      # The whole hostname is in DomainName, so the branch maps to its root
      # (Prefix: "") rather than admin- being a prefix under BaseDomainName.
      # Auto-subdomain is deliberately off: a per-branch name would be
      # <branch>.admin-<project>.<base>, two labels below the base, and
      # *.<base> does not cover that.
      SubDomainSettings:
        - Prefix: ""
          BranchName: !GetAtt AmplifyBranch.BranchName

  IiifServer:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:625046682746:applications/serverless-iiif
        SemanticVersion: !Ref ServerlessIiifVersion
      Parameters:
        SourceBucket: !Ref IIIFBucket
        # info.json advertises its own @id, and OpenSeadragon derives every tile
        # URL from it. Without ForceHost that @id is the Lambda Function URL, so
        # viewers walk straight past ImagesDistribution and the cache never sees
        # a tile.
        #
        # This deliberately cannot be !GetAtt ImagesDistribution.DomainName:
        # that distribution takes this app's FunctionDomain as its origin, so
        # pointing back at it is a CloudFormation cycle. Using the custom
        # hostname — a parameter, not an attribute — is what breaks it.
        #
        # The cost is that a stack with no custom domain has nothing to derive
        # from, so ImageApiForceHost exists to be handed the distribution host
        # explicitly on a second deploy. Still a parameter, so still no cycle.
        ForceHost: !If
          - HasImageApiForceHost
          - !Ref ImageApiForceHost
          - !If
            - HasCustomDomain
            - !Sub "images-${ProjectName}.${BaseDomainName}"
            - !Ref "AWS::NoValue"

Outputs:
  SourceBucketName:
    Value: !Sub "${AWS::StackName}-source"
  IIIFBucketName:
    Value: !Sub "${AWS::StackName}-iiif"
  IIIFImageFunctionArn:
    Value: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-iiif-image"
  IiifEndpoint:
    Description: "The Image API's origin, behind ImagesEndpoint. Useful for debugging; not what anything should be pointed at."
    Value: !Sub "https://${IiifServer.Outputs.FunctionDomain}/iiif/3"
  # A dev stack's CloudFront hostnames are generated and opaque (d111111abcdef8
  # shape), so without these there is no way to find them short of the console.
  IIIFEndpoint:
    Description: "Base URL for IIIF documents — the value baked into every manifest id. This is IIIF_BASE_URL."
    Value: !If
      - HasCustomDomain
      - !Sub "https://iiif-${ProjectName}.${BaseDomainName}"
      - !Sub "https://${IIIFDistribution.DomainName}"
  ImagesEndpoint:
    Description: "Base URL for the IIIF Image API. On a dev stack, info.json will still advertise IiifEndpoint — see ForceHost on IiifServer."
    Value: !If
      - HasCustomDomain
      - !Sub "https://images-${ProjectName}.${BaseDomainName}/iiif/3"
      - !Sub "https://${ImagesDistribution.DomainName}/iiif/3"
  ImagesDistributionHost:
    Description: "Bare hostname of the images distribution - paste into the ImageApiForceHost parameter on a stack with no custom domain."
    Value: !GetAtt ImagesDistribution.DomainName
  IIIFDistributionId:
    Description: "Invalidated by the publish run."
    Value: !Ref IIIFDistribution
  # Neither UI output exists without GitHubBranch: there is no hosted UI to name.
  UIEndpoint:
    Description: "Admin UI. The custom hostname once one is configured; the generated Amplify domain otherwise."
    Condition: HasHostedUI
    Value: !If
      - HasCustomDomain
      - !Sub "https://admin-${ProjectName}.${BaseDomainName}"
      - !Sub "https://${GitHubBranch}.${AmplifyApp.AppId}.amplifyapp.com"
  AmplifyDefaultDomain:
    Description: "The branch's generated Amplify domain, which keeps working alongside the custom one. Attaching a domain takes several minutes and the DNS record may not be this stack's to write, so this stays the way in until the custom hostname resolves."
    Condition: HasHostedUI
    Value: !Sub "https://${GitHubBranch}.${AmplifyApp.AppId}.amplifyapp.com"
  ManifestApiUrl:
    Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  PublicSearchUrl:
    Description: "Where a consuming site sends a search: replace {slug} with the collection id and add ?q= (and optionally from, size). Served through IIIFDistribution only."
    Value: !If
      - HasCustomDomain
      - !Sub "https://iiif-${ProjectName}.${BaseDomainName}/search/{slug}"
      - !Sub "https://${IIIFDistribution.DomainName}/search/{slug}"
  SearchEndpoint:
    Description: "The search collection's own endpoint. It answers only requests SigV4-signed by a role SearchDataAccessPolicy names, never a consuming site: that is PublicSearchUrl."
    Value: !GetAtt SearchCollection.CollectionEndpoint
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoIdentityPoolId:
    Value: !Ref CognitoIdentityPool
