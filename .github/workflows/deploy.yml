# Deploys staging-understory, from source, on every push to staging. It is
# the one shared stack that runs unreleased code: production and every other
# instance run a published release from an instance repo of their own (see
# "Deploying" in AGENTS.md), and merging to main publishes that release
# (release.yml). Dev stacks are never deployed from here.
#
# The stack's whole configuration is samconfig.staging.yaml, tracked in this
# repo: it holds no secret, so it is reviewed and merged like any other code.
name: Deploy

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "samconfig.yaml.example"
  workflow_dispatch:

# Queue, never cancel. Cancelling the runner does not stop CloudFormation, and
# the next run would then fail against a stack still UPDATE_IN_PROGRESS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # The environment's deployment-branch rule is the real gate, since a
    # branch could edit this condition. This only skips a dispatch from
    # another branch instead of failing it.
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: ${{ steps.urls.outputs.admin }}
    # Native arm64, like the Lambdas, so sam build --use-container runs the
    # arm64 build image (and sharp's linux-arm64 binary) without emulation.
    runs-on: ubuntu-24.04-arm
    env:
      STACK_NAME: staging-understory
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        run: npm test

      - uses: aws-actions/setup-sam@v3
        with:
          version: 1.148.0
          use-installer: true

      # The role is app/aws/deploy-role.yml, deployed by hand in each account.
      # Two hours, its MaxSessionDuration, so a long CloudFront or OpenSearch
      # update cannot outlast the credentials sam deploy is polling with.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWSACCOUNT }}:role/understory-github-actions-staging
          role-duration-seconds: 7200
          aws-region: us-east-1

      # The admin UI's static export, then every function.
      - name: Build
        run: scripts/build.sh

      # The template has no NoEcho parameter, and the config is public, so the
      # log may show it. A NoEcho parameter, if one is ever added, would come
      # from a GitHub secret, never from this file.
      - name: Deploy
        working-directory: app/aws
        run: |
          sam deploy \
            --config-file ../../samconfig.staging.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar

      # The UI was deployed with everything else (InstanceSetup), so there is
      # nothing left to build. This names it for the environment's link.
      - name: Read the admin URL
        id: urls
        run: |
          admin=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AdminUrl'].OutputValue" --output text)
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
